<title>Soccer Slime</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{color-scheme:dark;--font-title:'Fredoka','Nunito',system-ui,sans-serif;--font-display:'Lilita One','Fredoka',system-ui,sans-serif;--font-body:'Lilita One','Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif}
html,body,#root{height:100%}
body{font-synthesis:none;letter-spacing:.01em;margin:0;background:#07122b;color:#fff;font-family:var(--font-body);overflow-x:hidden}
button{font-family:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.screen-in{animation:screenIn .28s ease-out both}
.rise{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes introTitle{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
[data-tutdone] button:focus,[data-results] button:focus-visible,[data-results] button:focus{outline:3px solid #fbbf24;outline-offset:3px}
html.lock-scroll,html.lock-scroll body{overflow:hidden!important;overscroll-behavior:none;height:100%;position:fixed;inset:0;width:100%}
@keyframes introLetter{0%{opacity:0;transform:translateY(-140%) rotate(var(--r)) scale(1.6)}60%{opacity:1;transform:translateY(8%) rotate(0) scale(.94)}80%{transform:translateY(-4%) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes introFlash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
@keyframes introShake{0%,100%{transform:none}15%{transform:translate(-9px,6px)}30%{transform:translate(8px,-7px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(5px,5px)}80%{transform:translate(-2px,2px)}}
@keyframes introGlow{0%,100%{text-shadow:0 0 30px rgba(56,189,248,.8),0 5px 0 rgba(0,40,100,.45)}50%{text-shadow:0 0 60px rgba(125,211,252,1),0 0 110px rgba(56,189,248,.6),0 5px 0 rgba(0,40,100,.45)}}
@keyframes introOut{to{opacity:0;transform:scale(1.04)}}
.intro-logo{display:inline-block;font-family:var(--font-title);font-weight:700;text-transform:uppercase;line-height:1;white-space:nowrap;font-size:clamp(50px,11.5vw,150px);letter-spacing:.04em;color:transparent;
background:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%) no-repeat,linear-gradient(180deg,#ffffff 0%,#eaf4ff 46%,#8fc4f5 54%,#dff0ff 100%);
background-size:300% 100%,100% 100%;background-position:150% 0,0 0;-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 5px 0 rgba(6,24,60,.85)) drop-shadow(0 0 28px rgba(56,189,248,.45));
animation:introLogoIn .9s cubic-bezier(.16,1,.3,1) 2.95s both,introSweep 1.1s ease-in-out 3.7s both}
@keyframes introLogoIn{0%{opacity:0;letter-spacing:.32em;transform:scale(1.08);filter:blur(14px) drop-shadow(0 5px 0 rgba(6,24,60,.85))}100%{opacity:1;letter-spacing:.04em;transform:none}}
@keyframes introSweep{from{background-position:150% 0,0 0}to{background-position:-50% 0,0 0}}
.intro-tag{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;font-family:var(--font-title);font-weight:600;font-size:clamp(11px,1.6vw,16px);letter-spacing:.5em;text-transform:uppercase;color:rgba(214,234,255,.85);animation:introTag .8s ease-out 2.9s both}
.intro-tag span{display:block;width:clamp(30px,7vw,90px);height:1px;background:linear-gradient(90deg,rgba(214,234,255,0),rgba(214,234,255,.8))}
.intro-tag span:last-child{transform:scaleX(-1)}
@keyframes introCap{0%{opacity:0;transform:translateX(-14px)}20%,75%{opacity:1;transform:none}100%{opacity:0}}
.intro-cap{position:absolute;left:calc(env(safe-area-inset-left,0px) + 5vw);bottom:calc(10vh + 22px);display:flex;align-items:center;gap:12px;font-family:var(--font-title);font-weight:600;font-size:clamp(12px,1.5vw,16px);letter-spacing:.45em;text-transform:uppercase;color:rgba(255,255,255,.9);text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;animation:introCap .85s ease-out both;pointer-events:none;z-index:2}
.intro-cap span{display:block;width:34px;height:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
@keyframes introTag{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes introBars{0%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes introWelcome{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}
button:active{filter:brightness(.92)}
.kbd{display:inline-block;min-width:20px;padding:1px 6px;margin:0 3px;border-radius:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-bottom-width:3px;font-size:11px;font-weight:800;line-height:1.35;text-align:center;color:#fff;text-shadow:none}
/* No text selection, callout menu or tap flash when holding buttons; inputs stay selectable. */
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*,*::before,*::after{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable=true],input *,textarea *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
canvas,img{-webkit-user-drag:none}
.touch-controls,.rotate-hint{display:none}
@media (pointer:coarse){
  .touch-controls{display:flex}
  .kbd-hints{display:none!important}
  /* comfortable finger-sized targets */
  button,select,input:not([type=range]):not([type=color]){min-height:44px}
  button{touch-action:manipulation;min-width:44px}
}
@media (pointer:coarse) and (orientation:portrait){.rotate-hint{display:block}}
/* sideways the controls sit over the field's corners, so let the game show through */
@media (pointer:coarse) and (orientation:landscape){.tc-btn,.tc-pad{background:rgba(5,12,35,.3);border-color:rgba(255,255,255,.45)}}
.tc-btn{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(5,12,35,.55);color:#fff;font-size:26px;line-height:1;touch-action:none;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .06s,background .06s}
.tc-btn.on{background:rgba(125,211,252,.45);border-color:#fff;transform:scale(.93)}
.tc-pad{display:flex;border-radius:999px;border:2px solid rgba(255,255,255,.55);background:rgba(5,12,35,.55);touch-action:none;pointer-events:auto;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tc-pad span{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;transition:background .06s}
.tc-pad span.on{background:rgba(125,211,252,.45)}
.skin-pv{position:relative}
.skin-pv .eye{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,20,.55);opacity:0;transition:opacity .15s;pointer-events:none}
.skin-pv:hover .eye,.skin-pv:focus-visible .eye{opacity:1}
.sun{position:absolute;left:4%;top:3%;width:min(220px,32vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffff0 0,#fff6c0 16%,#ffe680 30%,rgba(255,214,90,.42) 50%,rgba(255,214,90,0) 70%);animation:sunPulse 6s ease-in-out infinite}

function qPickStrat(qt,state,pool,eps){

// Victory pose for the winning slime on the end screen. t counts frames since the match ended.
function poseStep(sl,pose,t,dirToCentre){
  var onGround=sl.y>=GH-GRND-1;
  if(pose==='hop'){if(onGround&&t%36===0)sl.vy=JUMP*0.6;}
  else if(pose==='shimmy'){sl.vx=Math.sin(t*0.25)*3;if(onGround&&t%48===0)sl.vy=JUMP*0.3;}
  else if(pose==='spin'){
    // jump straight up, do one full turn around the body's centre, land on the same spot
    if(sl._poseX==null)sl._poseX=sl.x;
    sl.x=sl._poseX;sl.vx=0;sl.isSpinning=false;sl.spinAngle=0;sl.spinDipY=0;
    var air=Math.round(2*Math.abs(JUMP*0.75)/GRAV);
    if(onGround&&(sl._spinT==null||sl._spinT>=air+28)){sl.vy=JUMP*0.75;sl._spinT=0;}
    if(sl._spinT!=null){sl._spinT++;var k=Math.min(1,sl._spinT/air),e=k<0.5?2*k*k:1-2*(1-k)*(1-k);sl._poseRot=dirToCentre*Math.PI*2*e;if(k>=1)sl._poseRot=0;}
  }
}

// Never lose progress: keep the higher achievement counts, and the longer history for each local player.
function mergeSaves(local,cloud){
  if(!cloud)return local;
  var a=cleanAchievementProgress(local.achievements),b=cleanAchievementProgress(cloud.achievements),ach=blankAchievementProgress();
  Object.keys(ach).forEach(function(k){ach[k]=k==='developerUnlocked'?(a[k]||b[k]):Math.max(a[k],b[k]);});
  var byId={};
  (cloud.players||[]).concat(local.players||[]).forEach(function(p){
    if(!p||!p.id)return;var cur=byId[p.id];
    if(!cur||(p.hist||[]).length>(cur.hist||[]).length)byId[p.id]=p;
  });
  return{
    achievements:ach,
    players:Object.keys(byId).map(function(id){return byId[id];}).slice(0,20),
    account:cloud.account||local.account,
    stickers:cloud.stickers||local.stickers,
    settings:cloud.settings||local.settings,
    friends:(function(){var seen={},out=[];(cloud.friends||[]).concat(local.friends||[]).forEach(function(f){if(f&&f.uid&&!seen[f.uid]){seen[f.uid]=1;out.push(f);}});return out.slice(0,50);})(),
    daily:cloud.daily&&(cloud.daily.lastDone||'')>((local.daily&&local.daily.lastDone)||'')?cloud.daily:(local.daily||{lastDone:'',streak:0})
  };
}
function writeLocalSave(save){
  try{
    window.localStorage.setItem('slime_achievements',JSON.stringify(save.achievements));
    window.localStorage.setItem('slime_db',JSON.stringify(save.players));
    window.localStorage.setItem('slime_account',JSON.stringify(save.account));
    window.localStorage.setItem('slime_sticker_slots',JSON.stringify(save.stickers));
    window.localStorage.setItem(GAME_SETTINGS_KEY,JSON.stringify(save.settings));
    window.localStorage.setItem('slime_friends',JSON.stringify(save.friends||[]));
    if(save.daily)window.localStorage.setItem('slime_daily',JSON.stringify(save.daily));
  }catch(e){console.warn('Could not store the cloud save on this device.',e);}
}
function cloudDoc(){return CLOUD.db.collection('saves').doc(CLOUD.user.uid);}
function cloudPull(){
  return cloudDoc().get().then(function(snap){
    if(!snap.exists)return null;
    try{return JSON.parse(snap.data().data);}catch(e){return null;}
  });
}
function cloudPushNow(){
  clearTimeout(CLOUD.saveTimer);
  if(!CLOUD.user||!CLOUD.db)return Promise.resolve(false);
  return cloudDoc().set({data:JSON.stringify(readLocalSave()),username:cloudUsernameOf(CLOUD.user),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){CLOUD.lastSync=Date.now();cloudPublish();if(CLOUD.onSynced)CLOUD.onSynced(true);return true;})
    .catch(function(e){console.warn('Cloud save failed.',e);if(CLOUD.onSynced)CLOUD.onSynced(false,e);return false;});
}
// Called after any local save; batches changes into one upload a couple of seconds later.
function cloudQueueSave(){
  if(!CLOUD.user||CLOUD.paused)return;
  clearTimeout(CLOUD.saveTimer);CLOUD.saveTimer=setTimeout(cloudPushNow,2500);
}

// ── Public profile (leaderboard + presence), friends and match invites ──
// leaderboard/{uid} is the only data other players can see: username, display name, look and a few counters.
var LEADERBOARD_FIELDS=[['wins','Wins'],['goals','Goals'],['bestWinStreak','Best streak'],['onlineWins','Online wins'],['impossibleWins','Chaos wins']];
var ONLINE_WINDOW_MS=90000;
function tsMillis(v){return v&&v.toMillis?v.toMillis():typeof v==='number'?v:0;}
function lastOnlineText(ts){var t=tsMillis(ts);if(!t)return 'Offline';var m=Math.floor((Date.now()-t)/60000);if(m<1)return 'Last online just now';if(m<60)return 'Last online '+m+'m ago';var h=Math.floor(m/60);if(h<24)return 'Last online '+h+'h ago';var d=Math.floor(h/24);return 'Last online '+(d===1?'yesterday':d<30?d+' days ago':'over a month ago');}
function cloudIsOnline(p){return !!p&&Date.now()-tsMillis(p.lastSeen)<ONLINE_WINDOW_MS;}
function cloudPublicProfile(){
  var a=loadAchievementProgress(),acct=loadAccountProfile(),p={username:cloudUsernameOf(CLOUD.user),name:acct.name||'',skin:(acct.avatar.pfpSkin&&acct.avatar.pfpSkin!=='same'?acct.avatar.pfpSkin:acct.avatar.skin)||'none',color:acct.avatar.kind==='slime'?acct.avatar.color:'#e8192c',lastSeen:firebase.firestore.FieldValue.serverTimestamp()};
  LEADERBOARD_FIELDS.forEach(function(f){p[f[0]]=a[f[0]]||0;});
  return p;
}
function lbCol(){return CLOUD.db.collection('leaderboard');}
function cloudPublish(){if(!CLOUD.user||!CLOUD.db)return Promise.resolve();return lbCol().doc(CLOUD.user.uid).set(cloudPublicProfile()).catch(function(e){console.warn('Leaderboard update failed.',e);});}
function cloudHeartbeat(){if(!CLOUD.user||!CLOUD.db)return Promise.resolve();return lbCol().doc(CLOUD.user.uid).set({lastSeen:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){});}
function cloudTop(field){return lbCol().orderBy(field,'desc').limit(25).get().then(function(s){return s.docs.map(function(d){return Object.assign({uid:d.id},d.data());});});}
function cloudFindPlayer(username){return lbCol().where('username','==',username).limit(1).get().then(function(s){return s.docs.length?Object.assign({uid:s.docs[0].id},s.docs[0].data()):null;});}
function cloudProfiles(uids){return Promise.all(uids.map(function(uid){return lbCol().doc(uid).get().then(function(d){return d.exists?Object.assign({uid:uid},d.data()):{uid:uid};}).catch(function(){return{uid:uid};});}));}
function cloudSendInvite(toUid,code){
  var acct=loadAccountProfile();
  return CLOUD.db.collection('invites').doc(toUid).set({fromUid:CLOUD.user.uid,from:cloudUsernameOf(CLOUD.user),name:acct.name||'',code:code,at:firebase.firestore.FieldValue.serverTimestamp()});
}
function cloudWatchInvites(cb){return CLOUD.db.collection('invites').doc(CLOUD.user.uid).onSnapshot(function(s){cb(s.exists?s.data():null);},function(e){console.warn('Invite listener stopped.',e);});}
function cloudClearInvite(){if(CLOUD.user&&CLOUD.db)CLOUD.db.collection('invites').doc(CLOUD.user.uid).delete().catch(function(){});}
// Friends are a private list in your own save: [{uid, username}].
function loadFriends(){try{var f=JSON.parse(window.localStorage.getItem('slime_friends')||'[]');return Array.isArray(f)?f.filter(function(x){return x&&typeof x.uid==='string'&&typeof x.username==='string';}).slice(0,50):[];}catch(e){return[];}}
function saveFriends(list){try{window.localStorage.setItem('slime_friends',JSON.stringify(list));}catch(e){}cloudQueueSave();}
function dbMk(name){return{id:'p'+Date.now(),name:name,wins:0,losses:0,draws:0,gf:0,ga:0,streak:0,maxStreak:0,hist:[]};}
function dbH2H(p1,p2){var o={w:0,l:0,d:0,gf:0,ga:0,bw:null,bl:null,streak:0,streakWho:null,lines:{}};if(!p1||!p2)return o;for(var i=0;i<p1.hist.length;i++){var m=p1.hist[i];if(m.opp!==p2.id)continue;if(m.r==='w'){o.w++;if(o.streakWho===p1.id)o.streak++;else{o.streak=1;o.streakWho=p1.id;}}else if(m.r==='l'){o.l++;if(o.streakWho===p2.id)o.streak++;else{o.streak=1;o.streakWho=p2.id;}}else{o.d++;o.streak=0;o.streakWho=null;}o.gf+=m.gf;o.ga+=m.ga;var sc=m.gf+'-'+m.ga;o.lines[sc]=(o.lines[sc]||0)+1;var df=m.gf-m.ga;if(df>0&&(!o.bw||df>o.bw.d))o.bw={gf:m.gf,ga:m.ga,d:df};if(df<0&&(!o.bl||df<o.bl.d))o.bl={gf:m.gf,ga:m.ga,d:df};}return o;}
function dbRecord(arr,id1,id2,g1,g2){var p1=null,p2=null;for(var i=0;i<arr.length;i++){if(arr[i].id===id1)p1=arr[i];if(arr[i].id===id2)p2=arr[i];}if(!p1||!p2)return;var ts=Date.now();if(g1>g2){p1.wins++;p2.losses++;p1.streak++;p2.streak=0;if(p1.streak>p1.maxStreak)p1.maxStreak=p1.streak;p1.hist.push({opp:id2,r:'w',gf:g1,ga:g2,ts:ts});p2.hist.push({opp:id1,r:'l',gf:g2,ga:g1,ts:ts});}else if(g1<g2){p2.wins++;p1.losses++;p2.streak++;p1.streak=0;if(p2.streak>p2.maxStreak)p2.maxStreak=p2.streak;p1.hist.push({opp:id2,r:'l',gf:g1,ga:g2,ts:ts});p2.hist.push({opp:id1,r:'w',gf:g2,ga:g1,ts:ts});}else{p1.draws=(p1.draws||0)+1;p2.draws=(p2.draws||0)+1;p1.streak=0;p2.streak=0;p1.hist.push({opp:id2,r:'d',gf:g1,ga:g2,ts:ts});p2.hist.push({opp:id1,r:'d',gf:g2,ga:g1,ts:ts});}p1.gf+=g1;p1.ga+=g2;p2.gf+=g2;p2.ga+=g1;}

// ─── SLIME DRAW (v2 sprites) ──────────────────────────────────────────────
// Same footprint as before: a dome of radius SR sitting on its flat base.
function slimeTones(col){
  var h=hexToHsl(col),grey=h[1]<8;
  return{
    light:hslToHex(h[0],Math.max(0,h[1]-6),Math.min(93,h[2]+24)),
    mid:col,
    dark:hslToHex(h[0],grey?h[1]:Math.min(100,h[1]+6),Math.max(6,h[2]-20)),
    line:hslToHex(h[0],grey?h[1]:Math.min(100,h[1]+12),Math.max(5,h[2]-36))
  };
}
function slimeDome(ctx,R){ctx.beginPath();ctx.arc(0,0,R,Math.PI,0);ctx.closePath();}
function starPath(ctx,x,y,r,rot){ctx.beginPath();for(var i=0;i<10;i++){var a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}

function paintSlimePattern(ctx,R,skin,dir,t){
  var p=skin.pattern,d=skin.detail;
  ctx.save();
  if(p==='stripes'){
    // twin racing stripes swept back from the face
    ctx.rotate(-dir*0.55);ctx.fillStyle=d;ctx.globalAlpha=0.85;
    ctx.fillRect(-dir*R*0.18-R*0.11,-R*1.6,R*0.22,R*2.4);
    ctx.globalAlpha=0.6;ctx.fillRect(-dir*R*0.48-R*0.05,-R*1.6,R*0.1,R*2.4);
  }else if(p==='stars'){
    var S=[[-0.6,-0.3,0.13,0.2],[-0.28,-0.62,0.09,0.6],[0.05,-0.82,0.06,0.1],[0.62,-0.6,0.08,0.9],[-0.05,-0.2,0.07,0.4],[0.72,-0.24,0.05,0.3]];
    ctx.fillStyle=d;
    for(var i=0;i<S.length;i++){var tw=0.75+0.25*Math.sin(t*0.004+i*1.9);ctx.globalAlpha=0.9*tw;starPath(ctx,-dir*S[i][0]*R,S[i][1]*R,S[i][2]*R*(0.9+0.2*tw),S[i][3]);ctx.fill();}
    ctx.globalAlpha=0.5;
    for(var k=0;k<8;k++){ctx.beginPath();ctx.arc(-dir*R*(-0.8+((k*37)%16)/10),-R*(0.12+((k*23)%8)/10),R*0.02,0,Math.PI*2);ctx.fill();}
  }else if(p==='waves'){
    var ph=t*0.0025;
    for(var w=0;w<3;w++){
      var base=-R*(0.52-w*0.17);
      ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(-R,base);
      for(var xx=-R;xx<=R;xx+=4)ctx.lineTo(xx,base+Math.sin(xx*0.11+ph+w*1.4)*R*0.06);
      ctx.lineTo(R,0);ctx.closePath();
      ctx.fillStyle=d;ctx.globalAlpha=0.22+w*0.16;ctx.fill();
    }
  }else if(p==='spots'){
    var B=[[-0.62,-0.28,0.16,0.13],[-0.3,-0.68,0.11,0.09],[0.08,-0.5,0.09,0.07],[0.58,-0.58,0.12,0.1],[0.7,-0.16,0.08,0.07],[-0.12,-0.14,0.07,0.06],[0.3,-0.84,0.05,0.05]];
    ctx.fillStyle=d;
    for(var b=0;b<B.length;b++){ctx.globalAlpha=0.72;ctx.beginPath();ctx.ellipse(-dir*B[b][0]*R,B[b][1]*R,B[b][2]*R,B[b][3]*R,b,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.45;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-dir*B[b][0]*R-B[b][2]*R*0.3,B[b][1]*R-B[b][3]*R*0.35,B[b][2]*R*0.3,B[b][3]*R*0.22,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=d;}
  }else if(p==='crown'){
    // royal sash
    ctx.rotate(dir*0.5);ctx.fillStyle=d;ctx.globalAlpha=0.8;ctx.fillRect(-R*1.4,-R*0.36,R*2.8,R*0.16);
  }else if(p==='robot'){
    drawRobotArmor(ctx,R,dir);
  }
  ctx.restore();
}

function drawRobotArmor(ctx,r,dir){
  dir=dir||1;
  ctx.save();
  // plating seams
  ctx.strokeStyle='rgba(30,41,59,0.55)';ctx.lineWidth=Math.max(1,r*0.035);
  ctx.beginPath();ctx.arc(0,0,r*0.72,Math.PI,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-dir*r*0.08,-r*0.72);ctx.lineTo(-dir*r*0.08,-r);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-r*0.05);ctx.lineTo(0,-r*0.72);ctx.globalAlpha=0.5;ctx.stroke();ctx.globalAlpha=1;
  // top plate sheen
  ctx.fillStyle='rgba(255,255,255,0.16)';ctx.beginPath();ctx.arc(0,0,r,Math.PI,0);ctx.arc(0,0,r*0.72,0,Math.PI,true);ctx.closePath();ctx.fill();
  // vent grille on the back
  ctx.strokeStyle='rgba(30,41,59,0.7)';ctx.lineWidth=Math.max(1,r*0.04);ctx.lineCap='round';
  for(var v=0;v<3;v++){var vy=-r*(0.18+v*0.12);ctx.beginPath();ctx.moveTo(-dir*r*0.42,vy);ctx.lineTo(-dir*r*0.68,vy);ctx.stroke();}
  // rivets
  ctx.fillStyle='#e2e8f0';
  for(var k=0;k<7;k++){var a=Math.PI+(k+0.5)*Math.PI/7;ctx.beginPath();ctx.arc(Math.cos(a)*r*0.86,Math.sin(a)*r*0.86,r*0.03,0,Math.PI*2);ctx.fill();}
  // status light
  var on=(performance.now()%1400)<900;
  ctx.fillStyle=on?'#4ade80':'#14532d';ctx.shadowColor='#4ade80';ctx.shadowBlur=on?r*0.2:0;
  ctx.beginPath();ctx.arc(-dir*r*0.22,-r*0.14,r*0.045,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawRobotEye(ctx,x,y,r,ox,oy){
  ox=ox||0;oy=oy||0;
  ctx.save();
  ctx.fillStyle='#1e293b';ctx.strokeStyle='#cbd5e1';ctx.lineWidth=r*0.055;
  ctx.beginPath();ctx.roundRect(x-r*0.27,y-r*0.2,r*0.54,r*0.4,r*0.14);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.roundRect(x-r*0.24,y-r*0.17,r*0.48,r*0.34,r*0.11);ctx.clip();
  ctx.shadowColor='#22d3ee';ctx.shadowBlur=r*0.25;ctx.fillStyle='#22d3ee';
  ctx.beginPath();ctx.roundRect(x+ox*0.9-r*0.1,y+oy*0.6-r*0.09,r*0.2,r*0.18,r*0.05);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(x+ox*0.9-r*0.07,y+oy*0.6-r*0.06,r*0.06,r*0.04);
  ctx.fillStyle='rgba(34,211,238,0.12)';for(var s=-3;s<=3;s++)ctx.fillRect(x-r*0.24,y+s*r*0.05,r*0.48,r*0.012);
  ctx.restore();ctx.restore();
}

// Paints the whole slime in local space: origin = centre of the flat base.
function paintSlime(ctx,R,col,acc,isR,skin,ix,iy,isJapan,glowCol,glowBlur,noBlink){
  var dir=isR?-1:1,T=slimeTones(col),t=performance.now(),robot=!!(skin&&skin.pattern==='robot');
  var outline=Math.max(1.2,R*0.06);
  // headband tails trail behind (drawn first so the knot tucks under the body)
  if(!robot){
    var kx=-dir*R*0.6,ky=-R*0.8,fl=Math.sin(t*0.012+(isR?2:0));
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=T.line;ctx.lineWidth=outline*0.7;ctx.fillStyle=acc;
    for(var tl=0;tl<2;tl++){
      var ex0=kx-dir*R*(0.42+tl*0.08),ey0=ky+R*(0.04+tl*0.2)+fl*R*(0.05+tl*0.03);
      ctx.beginPath();ctx.moveTo(kx,ky-R*0.04);
      ctx.quadraticCurveTo(kx-dir*R*0.22,ky-R*0.1+fl*R*0.05+tl*R*0.12,ex0,ey0-R*0.06);
      ctx.lineTo(ex0+dir*R*0.04,ey0+R*0.07);
      ctx.quadraticCurveTo(kx-dir*R*0.2,ky+R*0.06+tl*R*0.12,kx,ky+R*0.06);ctx.closePath();ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }
  // body
  ctx.save();
  if(glowBlur){ctx.shadowColor=glowCol;ctx.shadowBlur=glowBlur;}
  var g=ctx.createRadialGradient(-R*0.32,-R*0.66,R*0.05,-R*0.1,-R*0.3,R*1.2);
  g.addColorStop(0,T.light);g.addColorStop(0.45,T.mid);g.addColorStop(1,T.dark);
  ctx.fillStyle=g;slimeDome(ctx,R);ctx.fill();
  ctx.restore();
  ctx.save();slimeDome(ctx,R);ctx.clip();
  // jelly glow along the base (light bouncing up through the goo)
  var jg=ctx.createLinearGradient(0,0,0,-R*0.45);jg.addColorStop(0,T.light);jg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalAlpha=robot?0.12:0.32;ctx.fillStyle=jg;ctx.fillRect(-R,-R*0.45,R*2,R*0.45);ctx.globalAlpha=1;
  if(skin)paintSlimePattern(ctx,R,skin,dir,t);
  // headband
  if(!robot){
    ctx.fillStyle=acc;ctx.beginPath();ctx.moveTo(-R,-R*0.86+dir*R*0.03);ctx.lineTo(R,-R*0.86-dir*R*0.03);ctx.lineTo(R,-R*0.7-dir*R*0.03);ctx.lineTo(-R,-R*0.7+dir*R*0.03);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fillRect(-R,-R*0.86,R*2,R*0.035);
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(-R,-R*0.735,R*2,R*0.035);
  }
  // shade the back edge for roundness
  var sg=ctx.createLinearGradient(dir*R*0.2,0,-dir*R,0);sg.addColorStop(0,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=sg;ctx.fillRect(-R,-R,R*2,R);
  ctx.restore();
  // outline
  ctx.save();ctx.strokeStyle=T.line;ctx.lineWidth=outline;ctx.lineJoin='round';slimeDome(ctx,R-outline*0.5);ctx.stroke();ctx.restore();
  // headband knot
  if(!robot){ctx.save();ctx.fillStyle=acc;ctx.strokeStyle=T.line;ctx.lineWidth=outline*0.7;ctx.beginPath();ctx.ellipse(-dir*R*0.6,-R*0.78,R*0.08,R*0.1,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();}
  // gloss
  ctx.save();ctx.fillStyle='#fff';ctx.globalAlpha=0.5;
  ctx.beginPath();ctx.arc(0,0,R*0.84,Math.PI+0.32,Math.PI+0.95);ctx.arc(0,0,R*0.7,Math.PI+0.95,Math.PI+0.32,true);ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.75;ctx.beginPath();ctx.ellipse(-R*0.25,-R*0.9,R*0.05,R*0.035,-0.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // face
  var ex=dir*R*0.32,ey=-R*0.38;
  if(robot){drawRobotEye(ctx,ex,ey,R,ix,iy);
    // antenna
    ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=R*0.05;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-dir*R*0.15,-R*0.98);ctx.lineTo(-dir*R*0.22,-R*1.24);ctx.stroke();
    var blink=0.5+0.5*Math.sin(t*0.006);ctx.fillStyle='#f87171';ctx.shadowColor='#ef4444';ctx.shadowBlur=R*0.25*blink;ctx.beginPath();ctx.arc(-dir*R*0.22,-R*1.27,R*0.07,0,Math.PI*2);ctx.fill();ctx.restore();
  }else{
    var closed=!noBlink&&((t+(isR?1900:0))%4300)<120;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    if(closed){ctx.strokeStyle=T.line;ctx.lineWidth=R*0.07;ctx.beginPath();ctx.moveTo(ex-R*0.2,ey);ctx.quadraticCurveTo(ex,ey+R*0.12,ex+R*0.2,ey);ctx.stroke();}
    else{
      ctx.fillStyle='#fff';ctx.strokeStyle=T.line;ctx.lineWidth=R*0.045;
      ctx.beginPath();ctx.ellipse(ex,ey,R*0.22,R*0.25,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      var px=ex+ix*1.05,py=ey+iy*1.05;
      ctx.fillStyle=T.line;ctx.beginPath();ctx.ellipse(px,py,R*0.13,R*0.145,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0b0b14';ctx.beginPath();ctx.arc(px,py,R*0.075,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-R*0.05,py-R*0.06,R*0.045,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(px+R*0.045,py+R*0.05,R*0.02,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

// ─── Ball (v2: proper panelled football, rotates with spin) ──────────────
function drawBall(ctx,ball,isNight,isJapan){
  var x=ball.x,y=ball.y,groundY=GH-GRND,h=Math.max(0,groundY-y),sc=Math.max(0.3,1-h/260);
  ctx.save();ctx.globalAlpha=0.3*sc;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,groundY+3,BR*1.15*sc,BR*0.3*sc,0,0,Math.PI*2);ctx.fill();ctx.restore();
  var base0,base1,panel,edge;
  if(isJapan){base0='#ffffff';base1='#f1d4d8';panel='#c8102e';edge='#7a0019';}
  else if(isNight){base0='#fffbea';base1='#f7d774';panel='#3b2a00';edge='#5c4300';}
  else{base0='#ffffff';base1='#cfd8e3';panel='#1f2937';edge='#111827';}
  ctx.save();
  if(isNight){ctx.shadowColor='#FFD700';ctx.shadowBlur=22;}
  else if(isJapan){ctx.shadowColor='rgba(139,0,0,0.6)';ctx.shadowBlur=10;}
  else{ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=7;}
  var g=ctx.createRadialGradient(x-BR*0.35,y-BR*0.4,BR*0.1,x,y,BR*1.05);
  g.addColorStop(0,base0);g.addColorStop(0.6,base0);g.addColorStop(1,base1);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,BR,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(x,y,BR,0,Math.PI*2);ctx.clip();
  ctx.translate(x,y);ctx.rotate(ball.ang||0);
  function pent(cx,cy,r,rot){ctx.beginPath();for(var i=0;i<5;i++){var a=rot-Math.PI/2+i*Math.PI*2/5;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();}
  ctx.fillStyle=panel;ctx.strokeStyle=panel;ctx.lineWidth=Math.max(0.8,BR*0.08);
  pent(0,0,BR*0.36,0);ctx.fill();
  for(var k=0;k<5;k++){var a=-Math.PI/2+k*Math.PI*2/5,ix=Math.cos(a)*BR*0.36,iy=Math.sin(a)*BR*0.36,ox=Math.cos(a)*BR*1.08,oy=Math.sin(a)*BR*1.08;
    ctx.beginPath();ctx.moveTo(ix,iy);ctx.lineTo(Math.cos(a)*BR*0.76,Math.sin(a)*BR*0.76);ctx.stroke();
    pent(ox,oy,BR*0.32,a+Math.PI/2+Math.PI);ctx.fill();}
  ctx.restore();

  ctx.save();
  var sh=ctx.createRadialGradient(x-BR*0.3,y-BR*0.35,BR*0.2,x,y,BR);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,0.22)');

  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.ellipse(x-BR*0.38,y-BR*0.45,BR*0.22,BR*0.14,-0.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=edge;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,BR-0.6,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

// ─── Goal (v2: post, crossbar and a slanted back net) ─────────────────────
// Same footprint as before: opening is GOALW/2 deep and GOALH tall at each wall.
function drawGoal(ctx,flip,isNight,isJapan){
  var gy=GH-GRND,top=gy-GOALH,s=flip?-1:1,wall=flip?GW:0,post=flip?GW-GOALW/2:GOALW/2;
  var barCol,glow,glowB,netCol,netFill;
  if(isNight){barCol='#c8ffff';glow='#00eeff';glowB=16;netCol='rgba(120,240,255,0.38)';netFill='rgba(0,200,255,0.07)';}
  else if(isJapan){barCol='#ffffff';glow='#d9aebd';glowB=8;netCol='rgba(255,255,255,0.5)';netFill='rgba(255,255,255,0.1)';}
  else{barCol='#ffffff';glow='rgba(0,0,0,0.25)';glowB=5;netCol='rgba(255,255,255,0.5)';netFill='rgba(255,255,255,0.12)';}
  var backTop=top+18;
  ctx.save();
  // net body
  ctx.beginPath();ctx.moveTo(post,top);ctx.lineTo(wall,backTop);ctx.lineTo(wall,gy);ctx.lineTo(post,gy);ctx.closePath();
  ctx.fillStyle=netFill;ctx.fill();
  ctx.save();ctx.clip();
  ctx.strokeStyle=netCol;ctx.lineWidth=1;
  for(var d=-GOALH;d<=GOALW;d+=9){ctx.beginPath();ctx.moveTo(post-s*d,top);ctx.lineTo(post-s*(d+GOALH),gy);ctx.stroke();ctx.beginPath();ctx.moveTo(post-s*d,top);ctx.lineTo(post-s*(d-GOALH),gy);ctx.stroke();}
  // depth shading toward the back
  var dg=ctx.createLinearGradient(post,0,wall,0);dg.addColorStop(0,'rgba(0,0,0,0)');dg.addColorStop(1,'rgba(0,0,0,0.18)');ctx.fillStyle=dg;ctx.fillRect(Math.min(post,wall),top,GOALW/2,GOALH);
  ctx.restore();
  ctx.strokeStyle=netCol;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(post,top);ctx.lineTo(wall,backTop);ctx.stroke();
  // frame: dark under-stroke then bright bar
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor=glow;ctx.shadowBlur=glowB;
  ctx.strokeStyle='rgba(15,23,42,0.45)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(post,gy);ctx.lineTo(post,top);ctx.lineTo(wall,top);ctx.stroke();
  ctx.shadowBlur=isNight?glowB:0;
  ctx.strokeStyle=barCol;ctx.lineWidth=4.5;
  ctx.beginPath();ctx.moveTo(post,gy);ctx.lineTo(post,top);ctx.lineTo(wall,top);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(post-s*1,gy-2);ctx.lineTo(post-s*1,top+1);ctx.stroke();
  // goal line on the turf
  ctx.strokeStyle=barCol;ctx.globalAlpha=0.8;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(wall,gy+1);ctx.lineTo(post,gy+1);ctx.stroke();
  ctx.restore();
}

// ─── Menu mascot: two slimes keeping the ball up ─────────────────────────
function HeroCanvas(props){

}

// ─── Intro: three Japan-inspired scenes and a slime parade ────────────────
