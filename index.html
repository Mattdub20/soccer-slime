function cl1(v){return Math.max(-1,Math.min(1,v));}

var CROWD_R=3,CROWD_C=52,CROWD_N=CROWD_R*CROWD_C;
var FAN_SPD=[],FAN_THR=[],FAN_BOUNCE=[];
for(var _fi=0;_fi<CROWD_N;_fi++){FAN_SPD.push(0.1+Math.random()*0.4);FAN_THR.push(0.55+Math.random()*0.35);FAN_BOUNCE.push(0);}

function mkP(x,y,vx,vy,col,life,sz){return{x:x,y:y,vx:vx,vy:vy,color:col,life:life,maxLife:life,size:sz||3};}
function emitDash(P,x,y,dir,col,lite){if(P.length>200)return;var nL=lite?4:18,nD=lite?3:10,hsl=hexToHsl(col),light=hslToHex(hsl[0],Math.min(100,hsl[1]+15),Math.min(90,hsl[2]+30));for(var i=0;i<nL;i++){P.push({x:x-dir*SR*0.6,y:y+(Math.random()-0.5)*SR,vx:-dir*(6+Math.random()*10),vy:(Math.random()-0.5)*2.5,color:i%3===0?light:col,life:14+Math.random()*10,maxLife:24,size:3+Math.random()*3,isLine:true,lineLen:28+Math.random()*40,dir:dir});}for(var j=0;j<nD;j++){var a2=Math.PI/2*(Math.random()-0.5)-Math.PI/2*dir;P.push(mkP(x-dir*SR*0.4,y+(Math.random()-0.5)*SR*0.8,Math.cos(a2)*4,Math.sin(a2)*3-1,j%2===0?light:col,10+Math.random()*8,2+Math.random()*2));}}
function emitKick(P,x,y,bvx,bvy,col){for(var i=0;i<10;i++){var a=Math.atan2(bvy,bvx)+(Math.random()-0.5)*1.2,sp=1.5+Math.random()*3;P.push(mkP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,col,14+Math.random()*8,2+Math.random()*1.5));}}
function emitGoal(P,gx,gy,col){var hsl=hexToHsl(col),light=hslToHex(hsl[0],Math.min(100,hsl[1]+20),Math.min(90,hsl[2]+35)),dark=hslToHex(hsl[0],hsl[1],Math.max(10,hsl[2]-15));var gc=[col,col,col,light,light,dark];for(var i=0;i<80;i++){var a=Math.random()*Math.PI*2,sp=3+Math.random()*9;P.push(mkP(gx+(Math.random()-0.5)*60,gy+(Math.random()-0.5)*60,Math.cos(a)*sp,Math.sin(a)*sp-4,gc[Math.floor(Math.random()*gc.length)],40+Math.random()*30,3+Math.random()*4));}}
function emitBounce(P,x,y,vy){var it=Math.min(Math.abs(vy)/8,1);if(it<0.3)return;for(var i=0;i<Math.floor(it*8);i++){var a=-(Math.random()*Math.PI),sp=(1+Math.random()*3)*it;P.push(mkP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,'rgba(255,255,255,0.7)',10+Math.random()*8,1.5+Math.random()));}}
function emitSpin(P,x,y,col){for(var i=0;i<4;i++){var a=Math.random()*Math.PI*2;P.push(mkP(x+(Math.random()-0.5)*SR,y+(Math.random()-0.5)*SR*0.5,Math.cos(a)*1.5,Math.sin(a)*1.5-1,col,12+Math.random()*8,1.5+Math.random()));}}
function emitWall(P,x,y,spd){if(spd<3.5)return;var n=Math.min(8,Math.floor(spd));for(var i=0;i<n;i++){var a=(Math.random()-0.5)*2.2+(x<GW/2?0:Math.PI),sp=1+Math.random()*3;P.push(mkP(x,y,Math.cos(a)*sp,Math.sin(a)*sp-1,'rgba(255,255,255,0.8)',10+Math.random()*8,1.4+Math.random()));}}
function emitLand(P,x,y,vy){var it=Math.min(1,(vy-5)/10);if(it<=0)return;for(var i=0;i<Math.floor(3+it*5);i++){var s=(Math.random()<0.5?-1:1),sp=1+Math.random()*2.5*it;P.push(mkP(x+s*SR*0.5*Math.random(),y,s*sp,-Math.random()*1.6,'rgba(255,255,255,0.55)',12+Math.random()*8,1.6+Math.random()*1.4));}}

function dbLoad(){try{var r=window.localStorage.getItem('slime_db');if(r){var loaded=JSON.parse(r);if(Array.isArray(loaded)){for(var i=0;i<loaded.length;i++)if(typeof loaded[i].draws!=='number')loaded[i].draws=0;return loaded;}}}catch(e){}return[];}
function dbSave(a){try{window.localStorage.setItem('slime_db',JSON.stringify(a));}catch(e){}}
function dbMk(name){return{id:'p'+Date.now(),name:name,wins:0,losses:0,draws:0,gf:0,ga:0,streak:0,maxStreak:0,hist:[]};}
function dbH2H(p1,p2){var o={w:0,l:0,d:0,gf:0,ga:0,bw:null,bl:null,streak:0,streakWho:null,lines:{}};if(!p1||!p2)return o;for(var i=0;i<p1.hist.length;i++){var m=p1.hist[i];if(m.opp!==p2.id)continue;if(m.r==='w'){o.w++;if(o.streakWho===p1.id)o.streak++;else{o.streak=1;o.streakWho=p1.id;}}else if(m.r==='l'){o.l++;if(o.streakWho===p2.id)o.streak++;else{o.streak=1;o.streakWho=p2.id;}}else{o.d++;o.streak=0;o.streakWho=null;}o.gf+=m.gf;o.ga+=m.ga;var sc=m.gf+'-'+m.ga;o.lines[sc]=(o.lines[sc]||0)+1;var df=m.gf-m.ga;if(df>0&&(!o.bw||df>o.bw.d))o.bw={gf:m.gf,ga:m.ga,d:df};if(df<0&&(!o.bl||df<o.bl.d))o.bl={gf:m.gf,ga:m.ga,d:df};}return o;}
function dbRecord(arr,id1,id2,g1,g2){var p1=null,p2=null;for(var i=0;i<arr.length;i++){if(arr[i].id===id1)p1=arr[i];if(arr[i].id===id2)p2=arr[i];}if(!p1||!p2)return;var ts=Date.now();if(g1>g2){p1.wins++;p2.losses++;p1.streak++;p2.streak=0;if(p1.streak>p1.maxStreak)p1.maxStreak=p1.streak;p1.hist.push({opp:id2,r:'w',gf:g1,ga:g2,ts:ts});p2.hist.push({opp:id1,r:'l',gf:g2,ga:g1,ts:ts});}else if(g1<g2){p2.wins++;p1.losses++;p2.streak++;p1.streak=0;if(p2.streak>p2.maxStreak)p2.maxStreak=p2.streak;p1.hist.push({opp:id2,r:'l',gf:g1,ga:g2,ts:ts});p2.hist.push({opp:id1,r:'w',gf:g2,ga:g1,ts:ts});}else{p1.draws=(p1.draws||0)+1;p2.draws=(p2.draws||0)+1;p1.streak=0;p2.streak=0;p1.hist.push({opp:id2,r:'d',gf:g1,ga:g2,ts:ts});p2.hist.push({opp:id1,r:'d',gf:g2,ga:g1,ts:ts});}p1.gf+=g1;p1.ga+=g2;p2.gf+=g2;p2.ga+=g1;}

// ─── SLIME DRAW ───────────────────────────────────────────────────────────
function drawSlimeAt(ctx, x, y, col, acc, isR, spinAngle, spinDipY, isSpinning, isNight, isJapan, ballRefreshJump, ballRefreshTimer, _ballX, _ballY, skin) {
  var dY = spinDipY || 0;
  var groundY = GH - GRND;
  var heightAbove = Math.max(0, groundY - (y + dY));
  var airFrac = Math.min(1, heightAbove / ((GH - GRND - CEILING_Y) * 0.6));

  // Ground shadow
  ctx.save();
  ctx.globalAlpha = Math.max(0.04, 0.28 - airFrac * 0.22);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, groundY + 4, SR * Math.max(0.15, 1.0 - airFrac * 0.82), SR * 0.16 * Math.max(0.15, 1.0 - airFrac * 0.82), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, y + dY);
  ctx.rotate(spinAngle || 0);

  var hsl2 = hexToHsl(col);
  var lightC = hslToHex(hsl2[0], Math.max(0, hsl2[1]-5), Math.min(95, hsl2[2]+22));
  var darkC  = hslToHex(hsl2[0], Math.min(100,hsl2[1]+8), Math.max(5, hsl2[2]-20));

  // Outer glow
  if(isNight){ctx.shadowColor=col;ctx.shadowBlur=28;}
  else if(isSpinning){ctx.shadowColor=col;ctx.shadowBlur=18;}
  else{ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=6;}

  // Main body
  var bg=ctx.createRadialGradient(-SR*0.28,-SR*0.38,SR*0.04,-SR*0.05,-SR*0.05,SR*1.12);
  bg.addColorStop(0,lightC); bg.addColorStop(0.5,col); bg.addColorStop(1,darkC);
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,SR,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  if(skin){
    ctx.save();ctx.beginPath();ctx.arc(0,0,SR-1,Math.PI,0);ctx.closePath();ctx.clip();
    if(skin.pattern==='stripes'){
      ctx.strokeStyle=skin.detail;ctx.globalAlpha=0.72;ctx.lineWidth=7;
      for(var stripe=-3;stripe<=3;stripe++){ctx.beginPath();ctx.moveTo(stripe*19-SR,-SR);ctx.lineTo(stripe*19+SR,0);ctx.stroke();}
    }else if(skin.pattern==='stars'){
      ctx.fillStyle=skin.detail;ctx.globalAlpha=0.9;
      for(var star=0;star<5;star++){var sx=-SR+13+star*15,sy=-SR*0.52-(star%2)*13;ctx.beginPath();ctx.arc(sx,sy,star%2?2:3,0,Math.PI*2);ctx.fill();}
    }else if(skin.pattern==='spots'){
      ctx.fillStyle=skin.detail;ctx.globalAlpha=0.78;
      for(var spot=0;spot<7;spot++){var spx=-SR+10+(spot%4)*14,spy=-SR*0.36+Math.floor(spot/4)*15;ctx.beginPath();ctx.arc(spx,spy,spot%3===0?4:2.5,0,Math.PI*2);ctx.fill();}
    }else if(skin.pattern==='waves'){
      ctx.strokeStyle=skin.detail;ctx.globalAlpha=0.82;ctx.lineWidth=3;
      for(var wave=0;wave<3;wave++){ctx.beginPath();ctx.moveTo(-SR,-SR*0.25+wave*11);ctx.bezierCurveTo(-SR*0.4,-SR*0.55+wave*11,SR*0.1,-SR*0.05+wave*11,SR,-SR*0.38+wave*11);ctx.stroke();}
    }else if(skin.pattern==='crown'){
      ctx.fillStyle=skin.detail;ctx.globalAlpha=0.9;ctx.beginPath();ctx.moveTo(-SR*0.58,-SR*0.38);ctx.lineTo(-SR*0.3,-SR*0.72);ctx.lineTo(-SR*0.05,-SR*0.38);ctx.lineTo(SR*0.22,-SR*0.72);ctx.lineTo(SR*0.58,-SR*0.38);ctx.lineTo(SR*0.48,-SR*0.18);ctx.lineTo(-SR*0.48,-SR*0.18);ctx.closePath();ctx.fill();
    }else if(skin.pattern==='robot'){
      drawRobotArmor(ctx,SR);
    }
    ctx.restore();
  }

  // Bottom rim darkening
  ctx.save(); ctx.globalAlpha=0.22;
  var rim=ctx.createLinearGradient(0,-SR,0,0);
  rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(0,0,SR,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Specular
  ctx.save(); ctx.globalAlpha=0.30;
  var sh1=ctx.createRadialGradient(-SR*0.3,-SR*0.48,1,-SR*0.18,-SR*0.30,SR*0.46);
  sh1.addColorStop(0,'#fff'); sh1.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh1; ctx.beginPath(); ctx.arc(0,0,SR,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Accent stripe
  ctx.fillStyle=acc;
  ctx.beginPath();
  ctx.arc(0,0,SR-5,Math.PI+0.28,Math.PI+0.72);
  ctx.arc(0,0,SR-15,Math.PI+0.72,Math.PI+0.28,true);
  ctx.closePath(); ctx.fill();

  // Ball-refresh ring
  if(ballRefreshJump){
    var pulse=0.6+0.4*Math.sin((ballRefreshTimer||0)*0.25);
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=32*pulse;
    ctx.strokeStyle=col; ctx.globalAlpha=0.6+0.4*pulse; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,0,SR+5,Math.PI,0); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.globalAlpha=0.6*pulse; ctx.lineWidth=1.8;
    ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(0,0,SR+5,Math.PI,0); ctx.stroke();
    ctx.restore();
  }

  // Eye
  var ex = isR ? -SR*0.30 : SR*0.30;
  var ey = -SR*0.30;

  // Iris tracking
  var irisOX=0, irisOY=0;
  if(_ballX !== undefined){
    var sA=spinAngle||0;
    var ewX=x+ex*Math.cos(sA)-ey*Math.sin(sA);
    var ewY=(y+dY)+ex*Math.sin(sA)+ey*Math.cos(sA);
    var toX=_ballX-ewX, toY=_ballY-ewY;
    var dd=Math.sqrt(toX*toX+toY*toY);
    if(dd>0.01){
      var lx=toX*Math.cos(-sA)-toY*Math.sin(-sA);
      var ly=toX*Math.sin(-sA)+toY*Math.cos(-sA);
      var ll=Math.sqrt(lx*lx+ly*ly);
      var sc2=Math.min(1,dd/80);
      irisOX=(lx/ll)*2.8*sc2; irisOY=(ly/ll)*2.8*sc2;
    }
  }
  var iX=ex+irisOX, iY=ey+irisOY;

  if(skin&&skin.pattern==='robot')drawRobotEye(ctx,ex,ey,SR);
  else{
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(ex,ey,7,8,0,0,Math.PI*2); ctx.fill();
    ctx.save();ctx.shadowColor=col;ctx.shadowBlur=10;ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(iX,iY,4.5,5,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.globalAlpha=0.5;ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(iX-1.5,iY-2,1.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Japan blush
  if(isJapan){
    var bxj=isR?SR*0.15:-SR*0.15;
    ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='#ff8fab';
    ctx.beginPath(); ctx.ellipse(bxj,-SR*0.06,9,6,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawRobotArmor(ctx,r){
  ctx.save();ctx.beginPath();ctx.arc(0,0,r-1,Math.PI,0);ctx.closePath();ctx.clip();
  ctx.lineWidth=Math.max(1.2,r*0.045);ctx.strokeStyle='rgba(31,41,55,0.9)';
  ctx.fillStyle='rgba(226,232,240,0.46)';ctx.beginPath();ctx.moveTo(-r*0.83,-r*0.17);ctx.lineTo(-r*0.62,-r*0.69);ctx.lineTo(-r*0.12,-r*0.82);ctx.lineTo(-r*0.1,-r*0.2);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(71,85,105,0.38)';ctx.beginPath();ctx.moveTo(r*0.83,-r*0.17);ctx.lineTo(r*0.62,-r*0.69);ctx.lineTo(r*0.12,-r*0.82);ctx.lineTo(r*0.1,-r*0.2);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*0.84,-r*0.19);ctx.quadraticCurveTo(0,-r*0.05,r*0.84,-r*0.19);ctx.stroke();
  ctx.fillStyle='#475569';ctx.strokeStyle='#cbd5e1';ctx.lineWidth=Math.max(1,r*0.035);
  ctx.beginPath();ctx.roundRect(-r*0.16,-r*0.68,r*0.32,r*0.18,r*0.045);ctx.fill();ctx.stroke();
  ctx.fillStyle='#67e8f9';ctx.shadowColor='#22d3ee';ctx.shadowBlur=r*0.18;
  ctx.fillRect(-r*0.09,-r*0.63,r*0.18,r*0.035);ctx.shadowBlur=0;
  [-1,1].forEach(function(sign){
    ctx.fillStyle='#475569';ctx.beginPath();ctx.arc(sign*r*0.68,-r*0.27,r*0.055,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(sign*r*0.68-r*0.018,-r*0.29,r*0.018,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}
function drawRobotEye(ctx,x,y,r){
  ctx.save();ctx.shadowColor='#22d3ee';ctx.shadowBlur=r*0.16;
  ctx.fillStyle='#334155';ctx.strokeStyle='#d1d5db';ctx.lineWidth=r*0.06;
  ctx.beginPath();ctx.ellipse(x,y,r*0.25,r*0.27,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.shadowBlur=r*0.24;ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.arc(x,y,r*0.13,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#ecfeff';ctx.beginPath();ctx.arc(x-r*0.04,y-r*0.05,r*0.045,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSlime(ctx,sl,isR,col,acc,isNight,isJapan,skin){
  var dY=sl.spinDipY||0,vy=sl.vy||0,sq=sl.squash||0,sx=1,sy=1,air=sl.y<GH-GRND-2;
  if(air&&vy<-6){var st=Math.min(1,(-vy-6)/8);sx=1-0.13*st;sy=1+0.2*st;}
  else if(air&&vy>6){var fl=Math.min(1,(vy-6)/8);sx=1+0.1*fl;sy=1-0.1*fl;}
  if(sq>0){sx=1+0.22*sq;sy=1-0.24*sq;}
  var scaled=(sx!==1||sy!==1),px=sl.x,py=sl.y+dY;
  if(scaled){ctx.save();ctx.translate(px,py);ctx.scale(sx,sy);ctx.translate(-px,-py);}
  drawSlimeAt(ctx,sl.x,sl.y,skin?skin.color:col,skin?skin.accent:acc,isR,sl.spinAngle,sl.spinDipY,sl.isSpinning,isNight,isJapan,sl.ballRefreshJump,sl.ballRefreshTimer,sl._ballX,sl._ballY,skin);
  if(scaled)ctx.restore();
}

// ─── Mini slime for previews ──────────────────────────────────────────────
function miniSlime(ctx,x,y,r,col,acc,isR,isJapan,skin){
  if(skin){col=skin.color;acc=skin.accent;}
  var hsl=hexToHsl(col);
  var lC=hslToHex(hsl[0],Math.max(0,hsl[1]-5),Math.min(95,hsl[2]+22));
  var dC=hslToHex(hsl[0],hsl[1]?Math.min(100,hsl[1]+8):0,Math.max(5,hsl[2]-20)); // keep greys neutral (no red tint)
  var bg=ctx.createRadialGradient(x-r*0.28,y-r*0.38,r*0.04,x-r*0.05,y-r*0.05,r*1.12);
  bg.addColorStop(0,lC); bg.addColorStop(0.5,col); bg.addColorStop(1,dC);
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.closePath(); ctx.fill();
  if(skin){
    ctx.save();ctx.translate(x,y);ctx.scale(r/SR,r/SR);ctx.beginPath();ctx.arc(0,0,SR-1,Math.PI,0);ctx.closePath();ctx.clip();
    if(skin.pattern==='stripes'){ctx.strokeStyle=skin.detail;ctx.globalAlpha=0.72;ctx.lineWidth=7;for(var stripe=-3;stripe<=3;stripe++){ctx.beginPath();ctx.moveTo(stripe*19-SR,-SR);ctx.lineTo(stripe*19+SR,0);ctx.stroke();}}
    else if(skin.pattern==='stars'){ctx.fillStyle=skin.detail;ctx.globalAlpha=0.9;for(var star=0;star<5;star++){var sx=-SR+13+star*15,sy=-SR*0.52-(star%2)*13;ctx.beginPath();ctx.arc(sx,sy,star%2?2:3,0,Math.PI*2);ctx.fill();}}
    else if(skin.pattern==='spots'){ctx.fillStyle=skin.detail;ctx.globalAlpha=0.78;for(var spot=0;spot<7;spot++){var spx=-SR+10+(spot%4)*14,spy=-SR*0.36+Math.floor(spot/4)*15;ctx.beginPath();ctx.arc(spx,spy,spot%3===0?4:2.5,0,Math.PI*2);ctx.fill();}}
    else if(skin.pattern==='waves'){ctx.strokeStyle=skin.detail;ctx.globalAlpha=0.82;ctx.lineWidth=3;for(var wave=0;wave<3;wave++){ctx.beginPath();ctx.moveTo(-SR,-SR*0.25+wave*11);ctx.bezierCurveTo(-SR*0.4,-SR*0.55+wave*11,SR*0.1,-SR*0.05+wave*11,SR,-SR*0.38+wave*11);ctx.stroke();}}
    else if(skin.pattern==='crown'){ctx.fillStyle=skin.detail;ctx.globalAlpha=0.9;ctx.beginPath();ctx.moveTo(-SR*0.58,-SR*0.38);ctx.lineTo(-SR*0.3,-SR*0.72);ctx.lineTo(-SR*0.05,-SR*0.38);ctx.lineTo(SR*0.22,-SR*0.72);ctx.lineTo(SR*0.58,-SR*0.38);ctx.lineTo(SR*0.48,-SR*0.18);ctx.lineTo(-SR*0.48,-SR*0.18);ctx.closePath();ctx.fill();}
    else if(skin.pattern==='robot')drawRobotArmor(ctx,SR);
    ctx.restore();
  }
  // rim
  ctx.save(); ctx.globalAlpha=0.2;
  var rim=ctx.createLinearGradient(x,y-r,x,y);
  rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.restore();
  // specular
  ctx.save(); ctx.globalAlpha=0.28;
  var sh=ctx.createRadialGradient(x-r*0.28,y-r*0.48,1,x-r*0.15,y-r*0.28,r*0.42);
  sh.addColorStop(0,'#fff'); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.restore();
  // accent
  ctx.fillStyle=acc;
  ctx.beginPath();
  ctx.arc(x,y,r-r*0.12,Math.PI+0.28,Math.PI+0.72);
  ctx.arc(x,y,r-r*0.38,Math.PI+0.72,Math.PI+0.28,true);
  ctx.closePath(); ctx.fill();
  var ex2=isR?x-r*0.30:x+r*0.30, ey2=y-r*0.30;
