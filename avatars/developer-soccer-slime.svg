<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">Crowned red Soccer Slime</title>
  <desc id="desc">A red in-game slime wearing a little gold crown on a green pitch, inside a purple circular badge.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#292778"/>
      <stop offset="1" stop-color="#493582"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#39a567"/>
      <stop offset="1" stop-color="#176a4d"/>
    </linearGradient>
    <radialGradient id="slime" cx=".28" cy=".2" r=".86">
      <stop stop-color="#ff9aa8"/>
      <stop offset=".48" stop-color="#f32942"/>
      <stop offset="1" stop-color="#a80d32"/>
    </radialGradient>
    <clipPath id="badge">
      <circle cx="40" cy="40" r="37"/>
    </clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="80" height="80" fill="url(#sky)"/>
    <path d="M0 60 Q19 57 40 60 Q60 63 80 59 V80 H0Z" fill="url(#pitch)"/>
    <path d="M0 60 Q19 57 40 60 Q60 63 80 59" fill="none" stroke="#d7ffe8" stroke-opacity=".85" stroke-width="1.5"/>
    <path d="M0 68 H80" fill="none" stroke="#c5ffdf" stroke-opacity=".22" stroke-width="1"/>
    <path d="M9 61 C10 49 16 39 28 39 C40 39 47 48 48 61Z" fill="url(#slime)"/>
    <path d="M9 61 C10 49 16 39 28 39 C40 39 47 48 48 61Z" fill="none" stroke="#760d2a" stroke-opacity=".55" stroke-width="1"/>
    <ellipse cx="20" cy="46" rx="6.5" ry="3.7" fill="#fff" opacity=".16" transform="rotate(-32 20 46)"/>
    <path d="M12 56 A17 17 0 0 1 15 50 L18 52 A12 12 0 0 0 17 57Z" fill="#8b0000"/>
    <ellipse cx="29" cy="51" rx="2.8" ry="3.3" fill="#fff"/>
    <ellipse cx="29" cy="51" rx="1.85" ry="2.15" fill="#e8192c"/>
    <circle cx="28.5" cy="50.3" r=".7" fill="#fff"/>
    <g transform="translate(30 39) scale(.75) translate(-30 -39)">
      <path d="M21 41 L22.2 34.2 L27.5 38 L32.3 32.8 L34.5 39.2 L39.4 36.3 L38 42Z" fill="#ffd34e" stroke="#8a511d" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M22.4 40.3 L37.3 40.8 L36.8 43.3 Q29.8 45.1 22.2 43Z" fill="#f3a927" stroke="#8a511d" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="22.4" cy="34.5" r="1.3" fill="#fff2a1"/>
      <circle cx="32.3" cy="33" r="1.3" fill="#fff2a1"/>
      <circle cx="39.2" cy="36.5" r="1.3" fill="#fff2a1"/>
    </g>
  </g>
  <circle cx="40" cy="40" r="37" fill="none" stroke="#f4f4ff" stroke-width="2"/>
</svg>
